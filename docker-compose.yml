services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_PATH=/data/bitaqati.db
      - BASE_URL=${BASE_URL:?set BASE_URL in .env, e.g. https://cards.example.com}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - UMAMI_SRC=${UMAMI_SRC:-}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - CF_BEACON_TOKEN=${CF_BEACON_TOKEN:-}
      - REPORT_EMAIL=${REPORT_EMAIL:-me@mal7othify.com}
    volumes:
      - card-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env, e.g. cards.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  card-data:
  caddy-data:
  caddy-config:
